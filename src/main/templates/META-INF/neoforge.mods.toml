# NeoForge 1.21.1 mod metadata for Pryzma.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL=""

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL=""
authors="${mod_authors}"
displayTest="IGNORE_ALL_VERSION"
description='''${mod_description}'''

[[mixins]]
config="${mod_id}.mixins.json"

# Native shader pack pipeline.
[[mixins]]
config="${mod_id}-shader.mixins.json"

[[mixins]]
config="${mod_id}-shader-batching.mixins.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[21.1,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"

# Built-in rendering engine and shader pipeline: conflicting standalone mods are declared incompatible.
[[dependencies.${mod_id}]]
    modId="sodium"
    type="incompatible"
    reason="Pryzma includes an integrated rendering and shader engine. Remove standalone Sodium."
    versionRange="[0,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="embeddium"
    type="incompatible"
    reason="Pryzma includes an integrated rendering and shader engine. Remove standalone Embeddium."
    versionRange="[0,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="rubidium"
    type="incompatible"
    reason="Pryzma includes an integrated rendering and shader engine. Remove standalone Rubidium."
    versionRange="[0,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="iris"
    type="incompatible"
    reason="Pryzma includes a built-in shader pipeline. Remove standalone Iris."
    versionRange="[0,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="oculus"
    type="incompatible"
    reason="Pryzma includes a built-in shader pipeline. Remove standalone Oculus."
    versionRange="[0,)"
    ordering="NONE"
    side="CLIENT"
