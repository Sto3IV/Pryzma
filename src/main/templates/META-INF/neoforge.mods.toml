# NeoForge 1.21.1 mod metadata for Pryzma.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL=""

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL=""
authors="${mod_authors}"
displayTest="IGNORE_ALL_VERSION"
description='''${mod_description}'''

[[mixins]]
config="${mod_id}.mixins.json"

# Shader pack pipeline: a port of Iris (LGPL-3.0, see META-INF/LICENSE-IRIS) under net.pryzma.iris.
[[mixins]]
config="${mod_id}-iris.mixins.json"

[[mixins]]
config="${mod_id}-iris-batching.mixins.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[21.1,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"

# Pryzma carries its own port of Iris; a second copy would hook the same render paths.
[[dependencies.${mod_id}]]
    modId="iris"
    type="incompatible"
    reason="Pryzma includes its own shader pack pipeline (a port of Iris). Remove Iris."
    versionRange="[0,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="oculus"
    type="incompatible"
    reason="Pryzma includes its own shader pack pipeline (a port of Iris). Remove Oculus."
    versionRange="[0,)"
    ordering="NONE"
    side="CLIENT"
