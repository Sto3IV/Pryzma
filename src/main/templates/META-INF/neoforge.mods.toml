# NeoForge 1.21.1 mod metadata for Pryzma.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL=""

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL=""
authors="${mod_authors}"
displayTest="IGNORE_ALL_VERSION"
description='''${mod_description}'''

[[mixins]]
config="${mod_id}.mixins.json"

# Native shader pack pipeline.
[[mixins]]
config="${mod_id}-shader.mixins.json"

[[mixins]]
config="${mod_id}-shader-batching.mixins.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[21.1,)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="CLIENT"

# Conflicting standalone rendering / shader / LOD mods are declared incompatible.
[[dependencies.${mod_id}]]
    modId="sodium"
    type="incompatible"
    reason="На данном этапе развития Pryzma я пока не обладаю знаниями для бесконфликтной работы с Sodium.\nПожалуйста, не используйте их вместе."
    versionRange="[0,)"
    ordering="NONE"
    side="CLIENT"

